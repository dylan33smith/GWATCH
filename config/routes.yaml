
# when /hello/{name} is requested, call the helloAction method of TestController
# pass name as parameter
hello:
    path:   /hello/{name}
    controller: 'App\Controller\TestController::helloAction'

# Highway Browser Routes
display:
    path: /display.php
    controller: 'App\Controller\DisplayController::indexAction'

getColumns:
    path: /getColumns.php
    controller: 'App\Controller\DisplayController::columnsAction'

getData:
    path: /getData.php
    controller: 'App\Controller\DisplayController::dataAction'

search:
    path: /search.php
    controller: 'App\Controller\DisplayController::searchAction'

report:
    path: /report.php
    controller: 'App\Controller\DisplayController::reportAction'

